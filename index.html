<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciertos Conectados | Guatemala</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

    <header class="header-admin">
    <div class="header-contenido">
        <div class="branding-admin">
            <h1 class="titulo-panel">Conciertos conxion</h1>
        </div>
        <div class="nav-actions">
            <a href="html/seguritas.html" class="btn-cerrar-sesion" >Cuenta de Admin</a>
        </div>
    </nav>
</header>

    <section class="seccion-busqueda">
        <div class="busqueda-wrapper">
            <div class="search-row">
                <input type="text" placeholder="Buscar por nombre del evento..." id="input-busqueda">
            </div>
            <div class="filter-row">
                <select id="filtro-ciudad">
                    <option value="">Todas las ubicaciones</option>
                </select>
                <select id="filtro-categoria">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
        </div>
    </section>

    <main class="grid-principal">
        <div class="grid-eventos" id="grid-eventos">
        </div>
    </main>

    <script src="js/import.js"></script>
    <script src="js/indexdisplay.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/matematicashijo.js"></script>
</body>
</html>
