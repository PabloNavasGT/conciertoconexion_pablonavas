<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Concierto</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="fondo-negro-login">

    <main class="contenedor-carrito" style="max-width: 850px;">
        <div class="tarjeta-carrito">
            
            <div style="display: flex; gap: 30px; flex-wrap: wrap;">
                <img id="det-imagen" src="" alt="Portada del Concierto" style="width: 280px; max-width: 100%; border-radius: 10px; border: 2px solid var(--naranja-fuego); object-fit: cover; height: 350px;">
                
                <div style="flex: 1; min-width: 260px;">
                    <h1 id="det-nombre" class="subtitulo-seccion" style="font-size: 1.8rem; margin-bottom: 5px;">Cargando...</h1>
                    <p id="det-categoria" style="color: var(--texto-suave); text-transform: uppercase; font-size: 0.85rem; font-weight: 600; margin-bottom: 15px;"></p>
                    
                    <div style="background: rgba(255, 85, 0, 0.08); padding: 12px 16px; border-radius: 8px; border-left: 4px solid var(--naranja-fuego); margin-bottom: 15px;">
                        <p style="margin: 3px 0; font-size: 0.9rem; color: var(--blanco);"><strong>Hora:</strong> <span id="det-hora">--:--</span></p>
                        <p style="margin: 3px 0; font-size: 1.2rem; color: var(--amarillo-neon);"><strong>Precio:</strong> <span id="det-precio">Q0</span></p>
                    </div>

                    <p id="det-descripcion" style="line-height: 1.6; color: var(--texto-suave); font-size: 0.95rem; margin-bottom: 20px;"></p>
                    
                    <div class="campo" style="margin-bottom: 15px;">
                        <label for="cantidad-boletos">Cantidad de entradas:</label>
                        <input type="number" id="cantidad-boletos" value="1" min="1" max="10" style="text-align: center;">
                    </div>

                    <button id="btn-comprar-det" class="btn-guardar" style="width: 100%;">
                        COMPRAR ENTRADA
                    </button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--borde-input); margin: 30px 0 20px 0;">

            <section>
                <h3 class="subtitulo-seccion" style="font-size: 1.1rem; margin-bottom: 10px;">Información Adicional</h3>
                <div id="det-horarios" style="color: var(--texto-suave); font-size: 0.95rem;">
                    <p id="det-ubicacion">Ubicación: Cargando...</p> 
                </div>
            </section>
            
            <a href="../index.html" class="link-volver" style="margin-top: 25px;">← Volver a la cartelera</a>
        </div>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/detalle.js"></script>
</body>
</html>
