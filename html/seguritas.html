<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad | Conciertos Conectados</title> 
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="fondo-negro-login">

    <div class="contenedor-login">
        <div class="tarjeta-login">
            <div class="header-login">
                <span class="badge-admin">Módulo Administrativo</span>
                <h1 class="titulo-naranja">Acceso de Administrador</h1>
            </div>
            
            <form id="form-login">
                <div class="campo">
                    <label for="nombre-admin">Nombre de usuario</label>
                    <input type="text" id="nombre-admin" placeholder="Escribe tu nombre" required autocomplete="off">
                </div>
                
                <div class="campo">
                    <label for="email-admin">Correo Electrónico</label>
                    <input type="email" id="email-admin" placeholder="admin@mail.com" required autocomplete="off">
                </div>
                
                <div class="campo">
                    <label for="pass-admin">Contraseña</label>
                    <input type="password" id="pass-admin" placeholder="••••••••" required>
                </div>

                <div class="botones-login">
                    <button type="submit" class="btn-guardar">Ingresar al sistema</button>
                    <a href="../index.html" class="btn-cancelar">← Regresar al inicio</a>
                </div>
            </form>
        </div>
    </div>
    
     <script src="../js/import.js"></script>
    <script src="../js/seguritas.js"></script>
</body>
</html>
