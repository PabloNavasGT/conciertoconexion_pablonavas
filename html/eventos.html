<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tus Eventos</title>
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>

    <header class="header-admin">
        <div class="header-contenido">
            <h1 class="titulo-panel">Quirófano de Eventos</h1>
            <nav class="nav-admin">
                <a href="indexplus.html" class="btn-nav">Atrás</a>
                <a href="categorias.html" class="btn-nav">Categorías</a>
                <a href="invaneventos.html" class="btn-nav">Volver al Inventario</a>
            </nav>
        </div>
    </header>

    <main class="contenedor-formulario-admin">
        <div class="tarjeta-formulario">
            <h2 class="titulo-formulario">Crear / Editar Concierto</h2>

            <form id="formulario-evento">
                
                <div class="campo">
                    <label for="evento-nombre">Nombre del Evento:</label>
                    <input type="text" id="evento-nombre" placeholder="Ej. Humbe Tour 2026" required>
                </div>

                <div class="fila-doble">
                    <div class="campo">
                        <label for="evento-categoria">Categoría:</label>
                        <select id="evento-categoria" required>
                            <option value="">Selecciona...</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="evento-precio">Precio (Q):</label>
                        <input type="number" id="evento-precio" placeholder="Ej. 350" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="evento-hora">Hora del Evento:</label>
                    <input type="time" id="evento-hora" required>
                </div>

                <div class="campo">
                    <label for="evento-ciudad">Ubicación (Guatemala):</label>
                    <select id="evento-ciudad">
                        <option value="Xela">Xela</option>
                        <option value="Zona 1-8">Zona 1 - 8</option>
                        <option value="Zona 9-16">Zona 9 - 16</option>
                        <option value="Zona 17-22">Zona 17 - 22</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="evento-aforo">Capacidad Máxima (Aforo):</label>
                    <input type="number" id="evento-aforo" placeholder="Ej. 100" required>
                </div>

                <div class="campo">
                    <label for="evento-imagen">URL de la Imagen:</label>
                    <input type="url" id="evento-imagen" placeholder="https://..." required>
                </div>

                <div class="campo">
                    <label for="evento-descripcion">Descripción:</label>
                    <textarea id="evento-descripcion" rows="3" placeholder="Detalles..."></textarea>
                </div>

                <button type="submit" id="btn-guardar-evento" class="btn-guardar">
                    GUARDAR CONCIERTO
                </button>
            </form>
        </div>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/evento.js"></script>
</body>
</html>
