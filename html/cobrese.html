<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="fondo-negro-login">

    <main class="contenedor-carrito">
        <div class="tarjeta-carrito">
            <h2 class="titulo-carrito">Finalizar Compra</h2>
            <p style="text-align: center; color: var(--texto-suave); margin-bottom: 20px; font-size: 0.9rem;">Completa tus datos para recibir tus boletas.</p>
            
            <div class="total-box" style="text-align: center; margin-bottom: 25px;">
                <span style="font-size: 0.9rem; color: var(--texto-suave); display: block;">Total a pagar:</span>
                Q<span id="suma-total">0</span>
            </div>

            <form id="formulario-checkout" onsubmit="event.preventDefault();">
                <div class="campo">
                    <label for="cli-id">Número de Identificación</label>
                    <input type="text" id="cli-id" placeholder="DPI o Pasaporte">
                </div>
                
                <div class="campo">
                    <label for="cli-nombre">Nombre Completo</label>
                    <input type="text" id="cli-nombre" placeholder="Nombre como aparece en tu ID">
                </div>
                
                <div class="campo">
                    <label for="cli-direccion">Dirección de domicilio</label>
                    <input type="text" id="cli-direccion" placeholder="Calle, ciudad y país">
                </div>
                
                <div class="campo">
                    <label for="cli-telefono">Teléfono</label>
                    <input type="tel" id="cli-telefono" placeholder="Ej: +502 1234 5678">
                </div>
                
                <div class="campo">
                    <label for="cli-correo">Correo Electrónico</label>
                    <input type="email" id="cli-correo" placeholder="ejemplo@correo.com">
                </div>

                <div style="display: flex; align-items: center; gap: 10px; margin: 20px 0;">
                    <input type="checkbox" id="check-edad" style="width: 18px; height: 18px; accent-color: var(--naranja-fuego); cursor: pointer;">
                    <label for="check-edad" style="color: var(--texto-suave); font-size: 0.88rem; cursor: pointer; margin: 0;">Confirmo que soy mayor de 18 años</label>
                </div>

                <button type="button" class="btn-guardar" id="btn-finalizar-compra" onclick="finalizarCompra()" style="width: 100%;">
                    CONFIRMAR Y PAGAR
                </button>
            </form>

            <a href="carrito.html" class="link-volver">← Regresar al carrito</a>
        </div>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/carrito.js"></script>
</body>
</html>
