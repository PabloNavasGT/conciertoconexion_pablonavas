<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago | Conciertos Conectados</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="fondo-negro-login">

    <main class="contenedor-carrito" style="max-width: 600px;">
        <div class="tarjeta-carrito">
            <h2 class="titulo-carrito">Pasarela de Pago</h2>

            <form id="form-pago">
                <div class="campo">
                    <label for="tipo-tarjeta">Tipo de Tarjeta</label>
                    <select id="tipo-tarjeta" required style="width: 100%; padding: 12px; background: var(--gris-input); color: var(--blanco); border: 1px solid var(--borde-input); border-radius: 2px;">
                        <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                        <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="num-tarjeta">Número de Tarjeta (8 Dígitos)</label>
                    <input type="text" id="num-tarjeta" placeholder="12345678" minlength="8" maxlength="8" required>
                </div>

                <div class="campo">
                    <label for="nombre-tarjeta">Nombre del Titular</label>
                    <input type="text" id="nombre-tarjeta" placeholder="Tu nombre" required>
                </div>

                <div class="campo">
                    <label for="exp-tarjeta">Fecha de Expiración</label>
                    <input type="text" id="exp-tarjeta" placeholder="MM/AA o MM(AA)" maxlength="5" required>
                </div>

                <div class="campo">
                    <label for="cvv-tarjeta">CVV (3 Dígitos)</label>
                    <input type="password" id="cvv-tarjeta" placeholder="..." maxlength="3" required>
                </div>

                <div class="campo">
                    <label for="correo-pago">Correo Electrónico</label>
                    <input type="email" id="correo-pago" placeholder="correo@example.com" required>
                </div>

                <button type="submit" class="btn-pagar" style="margin-top: 20px;">
                    Cobrar
                </button>
            </form>

            <a href="carrito.html" class="link-volver">← Regresar al carrito</a>
        </div>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/pago.js"></script>
</body>
</html>
