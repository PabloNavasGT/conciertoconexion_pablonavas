<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Evento</title>
    <link rel="stylesheet" href="../css/base.css">
</head>
<body class="fondo-negro-login">

    <main class="contenedor-carrito" style="max-width: 850px;">
        <div class="tarjeta-carrito">
            <div id="detalle-evento" style="display: flex; gap: 30px; flex-wrap: wrap;">
                
                <div style="flex: 1; min-width: 280px;">
                    <img id="pub-imagen" src="" alt="Poster" style="width: 100%; border-radius: 10px; border: 2px solid var(--naranja-fuego); object-fit: cover; height: 350px;">
                </div>
                
                <div style="flex: 1; min-width: 280px;">
                    <h1 id="pub-nombre" class="subtitulo-seccion" style="font-size: 1.8rem; margin-bottom: 8px;">Nombre del Artista</h1>
                    <p id="pub-categoria" style="background: rgba(255,255,255,0.1); display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; color: var(--amarillo-neon); font-weight: 600; text-transform: uppercase; margin-bottom: 15px;"></p>
                    
                    <div style="background: rgba(255, 85, 0, 0.08); padding: 12px 16px; border-radius: 8px; border-left: 4px solid var(--naranja-fuego); margin-bottom: 15px;">
                        <p style="margin: 3px 0; font-size: 0.9rem; color: var(--blanco);"><strong>Hora:</strong> <span id="pub-hora">--:--</span></p>
                        <p style="margin: 3px 0; font-size: 1.2rem; color: var(--amarillo-neon);"><strong>Precio:</strong> <span id="pub-precio">Q0.00</span></p>
                    </div>

                    <p id="pub-descripcion" style="line-height: 1.6; color: var(--texto-suave); font-size: 0.95rem; margin-bottom: 25px;"></p>
                    
                    <button id="btn-comprar-detalle" class="btn-guardar" style="width: 100%;">
                        ADQUIRIR ENTRADAS
                    </button>
                </div>

            </div>

            <a href="../index.html" class="link-volver" style="margin-top: 25px;">← Volver a la cartelera</a>
        </div>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/eventopub.js"></script>
</body>
</html>
