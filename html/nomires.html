<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Compras</title>
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>

    <header class="header-admin">
        <div class="header-contenido">
            <h1 class="titulo-panel">Historial de Ventas</h1>
            <nav class="nav-admin">
                <a href="indexplus.html" class="btn-nav">Volver al Panel</a>
                <a href="../index.html" class="btn-nav">Vista Pública</a>
            </nav>
        </div>
    </header>

    <main class="contenedor-admin-ancho">
        <div class="tarjeta-admin-seccion">
            <h2 class="subtitulo-seccion">Registro de Ventas Realizadas</h2>

            <div class="tabla-responsive">
                <table class="tabla-custom">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Referencia</th>
                            <th>Cliente</th>
                            <th>Productos</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-ventas"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para ver detalle completo -->
    <div id="modal-detalle-compra" class="modal-overlay">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="btn-cerrar-modal">&times;</span>
            <h2 class="subtitulo-seccion" id="modal-titulo-ref">Detalle de Compra</h2>
            <p class="texto-suave" id="modal-fecha"></p>

            <div class="detalle-seccion">
                <h4 class="subtitulo-campo">Información del Cliente</h4>
                <p id="modal-cliente-nombre"></p>
                <p class="texto-suave" id="modal-cliente-datos"></p>
            </div>

            <h4 class="subtitulo-campo">Desglose de Entradas</h4>
            <ul class="lista-items-modal" id="modal-lista-productos"></ul>

            <div class="total-resumen-modal">
                <strong>Total Pagado: </strong>
                <span class="monto-destacado" id="modal-total-pago"></span>
            </div>
        </div>
    </div>

    <script src="../js/import.js"></script>
    <script src="../js/historial.js"></script>
</body>
</html>
