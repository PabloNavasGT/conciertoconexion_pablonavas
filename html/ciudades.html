<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ciudades</title>
    <link rel="stylesheet" href="../css/base.css"> 
    <link rel="stylesheet" href="../css/plataformas.css"> 
</head>
<body>

    <header class="header-admin">
        <div class="header-contenido">
            <h1 class="titulo-panel">Administrar Ciudades</h1>
            <nav class="nav-admin">
                <a href="indexplus.html" class="btn-nav">Volver al Panel Admin</a>
                <a href="eventos.html" class="btn-nav">Ir a creación de concierto</a>
                <a href="../index.html" class="btn-nav">Vista Pública</a>
            </nav>
        </div>
    </header>

    <main class="contenedor-ciudades">
        <section class="tarjeta-admin-seccion form-cat">
            <h3 class="subtitulo-seccion">Nueva Ciudad</h3>
            <div class="campo">
                <input type="text" id="ciudad-nombre" placeholder="Ej. Guatemala, Xela, Antigua..." required>
            </div>
            <button id="btn-guardar-ciudad" class="btn-guardar">
                Guardar Ciudad
            </button>
        </section>

        <section class="tarjeta-admin-seccion lista-cat">
            <h3 class="subtitulo-seccion">Ciudades Existentes</h3>
            <ul id="lista-ciudades" class="lista-custom"></ul>
        </section>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/ciudades.js"></script>
</body>
</html>
