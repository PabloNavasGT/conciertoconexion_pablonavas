<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Eventos</title>
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>

    <header class="header-admin">
        <div class="header-contenido">
            <h1 class="titulo-panel">Panel de Control: Inventario</h1>
            <nav class="nav-admin">
                <a href="indexplus.html" class="btn-nav">Volver al Panel</a>
                <a href="eventos.html" class="btn-nav">Nuevo Evento +</a>
                <a href="../index.html" class="btn-nav">Vista Pública</a>
            </nav>
        </div>
    </header>

    <main class="contenedor-admin-ancho">
        <div class="tarjeta-admin-seccion">
            <div class="tabla-responsive">
                <table class="tabla-custom">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Evento / Categoría</th>
                            <th>Precio (Q)</th>
                            <th>Hora</th>
                            <th>ID</th>
                            <th class="texto-centro">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-inventario-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/listevento.js"></script>
</body>
</html>
