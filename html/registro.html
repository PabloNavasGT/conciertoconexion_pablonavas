<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Conciertos Conectados</title>
    <link rel="stylesheet" href="../css/base.css">
</head>
<body class="fondo-negro-login">
    <div class="contenedor-login">
        <div class="tarjeta-login">
            <h1 class="titulo-naranja" style="text-align:center; margin-bottom:20px;">Crear Cuenta</h1>
            <form id="form-registro">
                <div class="campo">
                    <label>Nombre</label>
                    <input type="text" id="reg-nombre" required>
                </div>
                <div class="campo">
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password" id="reg-pass" required>
                </div>
                <button type="submit" class="btn-guardar" style="width:100%; margin-top:15px;">Registrarse</button>
            </form>
            <a href="seguritas.html" class="link-volver">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
    <script>
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('reg-nombre').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-pass').value
            };

            const respuesta = await fetch('http://localhost:3000/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const resultado = await respuesta.json();
            if (respuesta.ok) {
                alert("¡Registro exitoso! Por favor inicia sesión.");
                window.location.href = 'seguritas.html';
            } else {
                alert(resultado.error);
            }
        });
    </script>
</body>
</html>
