<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías</title>
    <link rel="stylesheet" href="../css/base.css"> 
    <link rel="stylesheet" href="../css/plataformas.css">
</head>
<body>

    <header class="header-admin">
        <div class="header-contenido">
            <h1 class="titulo-panel">Administrar Categorías</h1>
            <nav class="nav-admin">
                <a href="indexplus.html" class="btn-nav">Volver al Panel Admin</a>
                <a href="eventos.html" class="btn-nav">Ir a creación de concierto</a>
            </nav>
        </div>
    </header>

    <main class="contenedor-categorias">
        <section class="tarjeta-admin-seccion form-cat">
            <h3 class="subtitulo-seccion">Nueva Categoría</h3>
            <div class="campo">
                <input type="text" id="cat-nombre" placeholder="Ej. Rock, Pop, Teatro..." required>
            </div>
            <button id="btn-guardar-cat" class="btn-guardar">
                Guardar Categoría
            </button>
        </section>

        <section class="tarjeta-admin-seccion lista-cat">
            <h3 class="subtitulo-seccion">Categorías Existentes</h3>
            <ul id="lista-categorias" class="lista-custom"></ul>
        </section>
    </main>

    <script src="../js/import.js"></script>
    <script src="../js/categorias.js"></script>
</body>
</html>
